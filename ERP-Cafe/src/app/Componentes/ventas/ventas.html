<div class="pantalla-fondo">
    <div class="contenedor-modulo">
        <div class="modulo-titulo">Venta</div>

        <div class="layout-doble">
            <div class="grid-productos">
                @for (producto of productos; track producto.id) {
                    <app-cafe-card
                        [producto]="producto"
                        modo="venta"
                        (cantidadChange)="actualizarSeleccion($event)">
                    </app-cafe-card>
                }
            </div>

            <div class="sidebar-acciones">
                <button class="boton-accion boton-alto" (click)="confirmarCompra()">Comprar</button>
                <button class="boton-accion boton-alto" (click)="cancelarCompra()">Cancelar</button>
            </div>
        </div>
    </div>
</div>
